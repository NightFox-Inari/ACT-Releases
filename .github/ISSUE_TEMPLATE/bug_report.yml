name: 操作異常回報
description: 回報 ACT 圖台、連線或模型操作問題（勿附公司模型或敏感資料）
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 此回報公開可見。請先遮蔽案件名稱、個人路徑與授權；安全漏洞請使用私人管道。
  - type: input
    id: versions
    attributes:
      label: ACT／ARC／工具鏈版本與 Revit 年度
      placeholder: 例如 ACT …、ARC …、Revit 2024
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小重現步驟、預期與實際結果
      description: 使用可丟棄的測試資料。請勿上傳正式案件或完整 IPC。
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 去識別的錯誤摘要
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開資料確認
      options:
        - label: 我已檢查內容與附件，移除公司模型、圖紙、個人資料、路徑、憑證與 grant。
          required: true
